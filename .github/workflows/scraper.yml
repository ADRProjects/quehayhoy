name: Actualizar Precios de Divisas

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub website if you want

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el Scraper (Actualizar data.json)
        run: python scraper.py

      - name: Subir los nuevos precios a la web
        run: |
          git config --global user.name "QueHayHoy Bot"
          git config --global user.email "bot@quehayhoy.cuba"
          git add data.json
          # Only commit if data.json actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated price update" && git push)